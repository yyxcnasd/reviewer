# 大分类与标签
#
# categories：题目的「大分类」。管理员（仓库 maintainer）改这个文件、提 PR 即可增删。
#   id     文件目录名与 URL 片段，只用小写字母、数字、连字符
#   label  站点上显示的名字
#   desc   一句话说明
#   course 关联的课程 id（用于范围判定；「其他」留空表示不受考纲约束）
#
# tags：初始标签表。题目里可以写这个表之外的标签，构建时会提示（不会报错），
#       管理员确认后再加到这里，标签页才会正式生成。

categories:
  - id: calculus
    label: 微积分
    desc: 极限、连续、导数、中值定理、泰勒公式
    course: va1
  - id: linear-algebra
    label: 线性代数
    desc: 方程组与行列式、矩阵、n 维向量空间
    course: la
  - id: discrete
    label: 离散数学
    desc: 命题逻辑、谓词逻辑、等值与推理演算、范式与归结
    course: dm
  - id: cs
    label: 计算机系统
    desc: 数据表示、汇编与寻址、控制流、函数调用、数组与结构体、缓冲区溢出
    course: ics
  - id: other
    label: 其他
    desc: 不在上面两门课范围里的题：数学分析、高等代数、竞赛题、方法论
    course: ""

