# 两门课的范围图谱
#
# 这个文件是整个站点的骨架：章节列表、考纲状态、关键词索引都在这里。
# 站点上的「范围图」「考纲判定器」「题库筛选」全部由它生成，改这里即可，不用碰代码。
#
# state 取值：
#   in       期中范围内
#   boundary 恰好踩在边界上（含在范围内，但到此为止）
#   out      期中之后才考，灰掉显示
#
# keywords：考纲判定器的关键词。用户输入「极值」「基础解系」这类词时，
# 用它判断在不在范围内。关键词尽量用学生真的会说出来的词。

# 考试轮次：站点上的「期中 / 期末」开关读这里。加一门课的期末，就在下面加一项。
terms:
  - id: midterm
    label: 期中
    note: 第一轮，期中考试范围
  - id: final
    label: 期末
    note: 第二轮，期末考试范围

exam:
  name: 期中
  semester: 2026 秋

courses:
  - id: va1
    name: 微积分 A1
    short: 微积分
    accent: red
    book: 高等微积分教程（上）· 刘智新 闫浩 章纪民
    scope_midterm: 第 1 章 – 第 4.3 节（泰勒公式）
    scope_final: 第 1 章 – 第 7 章（含定积分、广义积分、常微分方程）
    scope_note_midterm: 课本 4.3 节「泰勒公式」含在内，4.4 节起不在期中范围。
    scope_note_final: 整本书：4.4 节起的极值、凹凸、渐近线，以及定积分、广义积分、常微分方程都在范围内。
    notes_intro: >-
      半个学期的内容，从实数列的极限讲到泰勒公式。这里的要点按课本章节排，
      每条都是考场上真的会用到的：定义怎么叙述、定理的适用条件、最容易算错的那一步。
