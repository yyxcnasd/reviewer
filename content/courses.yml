# 两门课的范围图谱
#
# 这个文件是整个站点的骨架：章节列表、考纲状态、关键词索引都在这里。
# 站点上的「范围图」「考纲判定器」「题库筛选」全部由它生成，改这里即可，不用碰代码。
#
# state 取值：
#   in       期中范围内
#   boundary 恰好踩在边界上（含在范围内，但到此为止）
#   out      期中之后才考，灰掉显示
#
# keywords：考纲判定器的关键词。用户输入「极值」「基础解系」这类词时，
# 用它判断在不在范围内。关键词尽量用学生真的会说出来的词。

# 考试轮次：站点上的「期中 / 期末」开关读这里。加一门课的期末，就在下面加一项。
terms:
  - id: midterm
    label: 期中
    note: 第一轮，期中考试范围
  - id: final
    label: 期末
    note: 第二轮，期末考试范围

exam:
  name: 期中
  semester: 2026 秋

courses:
  - id: va1
    name: 微积分 A1
    short: 微积分
    accent: red
    book: 高等微积分教程（上）· 刘智新 闫浩 章纪民
    scope_line: 第 1 章 – 第 4.3 节
    scope_note: 课本 4.3 节「泰勒公式」含在内，4.4 节起不在期中范围。
    notes_intro: >-
      半个学期的内容，从实数列的极限讲到泰勒公式。这里的要点按课本章节排，
      每条都是考场上真的会用到的：定义怎么叙述、定理的适用条件、最容易算错的那一步。
    chapters:
      - id: va1-1
        no: "1"
        title: 实数系与实数列的极限
        state: in
        summary: 确界、ε–N 定义、收敛数列的性质与单调有界准则。
        sections:
          - no: "1.1"
            title: 实数系
            state: in
            terms:
              midterm: in
              final: in
            keywords: [实数系, 确界, 上确界, 下确界, 完备性, 阿基米德公理, 区间套]
          - no: "1.2"
            title: 数列极限的基本概念
            state: in
            terms:
              midterm: in
              final: in
            keywords: [数列极限, ε-N, ε–N, 极限定义, 收敛数列, 发散]
          - no: "1.3"
            title: 收敛数列的性质
            state: in
            terms:
              midterm: in
              final: in
            keywords: [极限唯一性, 有界性, 保号性, 四则运算, 夹逼, 迫敛, 子列]
          - no: "1.4"
            title: 单调数列
            state: in
            terms:
              midterm: in
              final: in
            keywords: [单调有界, 单调数列, 递推数列, 压缩映射, 数列收敛]
          - no: "1.5"
            title: 关于实数系的几个基本定理
            state: in
            terms:
              midterm: in
              final: in
            keywords: [柯西收敛准则, 聚点定理, 波尔查诺, 魏尔斯特拉斯, 有限覆盖, 闭区间套]

      - id: va1-2
        no: "2"
        title: 函数 函数的极限与连续
        state: in
        summary: ε–δ 定义、无穷小的阶、连续性与间断点、闭区间上连续函数的四条性质。
        sections:
          - no: "2.1"
            title: 函数
            state: in
            terms:
              midterm: in
              final: in
            keywords: [函数, 定义域, 复合函数, 反函数, 初等函数, 有界性, 奇偶性, 周期性]
          - no: "2.2"
            title: 函数极限的概念
            state: in
            terms:
              midterm: in
              final: in
            keywords: [函数极限, ε-δ, ε–δ, 单侧极限, 左极限, 右极限, 无穷远]
          - no: "2.3"
            title: 函数极限的性质
            state: in
            terms:
              midterm: in
              final: in
            keywords: [极限性质, 夹逼, 单调有界, 海涅定理, 归结原则, 极限存在准则]
          - no: "2.4"
            title: 无穷小量与无穷大量
            state: in
            terms:
              midterm: in
              final: in
            keywords: [无穷小, 无穷大, 等价无穷小, 同阶, 高阶无穷小, 无穷小的比较, 主部]
          - no: "2.5"
            title: 函数的连续与间断
            state: in
            terms:
              midterm: in
              final: in
            keywords: [连续, 间断点, 第一类间断, 第二类间断, 可去间断, 跳跃间断]
          - no: "2.6"
            title: 闭区间上连续函数的性质
            state: in
            terms:
              midterm: in
              final: in
            keywords: [有界性定理, 最值定理, 零点定理, 介值定理, 一致连续, 连续函数]

      - id: va1-3
        no: "3"
        title: 函数的导数
        state: in
        summary: 导数与微分的定义、求导法则、隐函数与参数方程求导、高阶导数。
        sections:
          - no: "3.1"
            title: 导数与微分的概念
            state: in
            terms:
              midterm: in
              final: in
            keywords: [导数定义, 可导, 可微, 单侧导数, 切线, 微分, 导数与连续]
          - no: "3.2"
            title: 求导法则
            state: in
            terms:
              midterm: in
              final: in
            keywords: [求导法则, 链式法则, 复合函数求导, 隐函数求导, 参数方程求导, 对数求导, 反函数求导]
          - no: "3.3"
            title: 高阶导数
            state: in
            terms:
              midterm: in
              final: in
            keywords: [高阶导数, 二阶导数, n阶导数, 莱布尼茨公式, 高阶微分]

      - id: va1-4
        no: "4"
        title: 导数应用
        state: in
        summary: 微分中值定理、洛必达法则、泰勒公式——期中到此为止。
        sections:
          - no: "4.1"
            title: 微分中值定理
            state: in
            terms:
              midterm: in
              final: in
            keywords: [费马引理, 罗尔定理, 拉格朗日中值定理, 柯西中值定理, 中值定理, 辅助函数]
          - no: "4.2"
            title: 洛必达法则
            state: in
            terms:
              midterm: in
              final: in
            keywords: [洛必达, 洛必达法则, 未定式, 0比0, 无穷比无穷, 待定型]
          - no: "4.3"
            title: 泰勒公式
            state: boundary
            terms:
              midterm: boundary
              final: in
            keywords: [泰勒公式, 泰勒展开, 麦克劳林, 皮亚诺余项, 拉格朗日余项, 泰勒多项式]
          - no: "4.4"
            title: 函数的增减性与极值问题
            state: out
            terms:
              midterm: out
              final: in
            keywords: [单调性, 增减性, 极值, 极大值, 极小值, 最值, 驻点]
          - no: "4.5"
            title: 凸函数
            state: out
            terms:
              midterm: out
              final: in
            keywords: [凸函数, 凹函数, 拐点, 凹凸性, 琴生不等式]
          - no: "4.6"
            title: 函数作图
            state: out
            terms:
              midterm: out
              final: in
            keywords: [渐近线, 作图, 函数图像]

      - id: va1-5
        no: "5"
        title: 黎曼积分
        state: out
        summary: 期中之后的内容。
        sections:
          - no: "5.1"
            title: 黎曼积分的概念
            state: out
            terms:
              midterm: out
              final: in
            keywords: [定积分, 黎曼积分, 可积, 达布和, 积分存在条件]
          - no: "5.3"
            title: 微积分基本定理
            state: out
            terms:
              midterm: out
              final: in
            keywords: [微积分基本定理, 牛顿-莱布尼茨, 变上限积分]
          - no: "5.4"
            title: 不定积分的概念与积分法
            state: out
            terms:
              midterm: out
              final: in
            keywords: [不定积分, 换元积分, 分部积分, 原函数]

      - id: va1-6
        no: "6"
        title: 广义黎曼积分
        state: out
        summary: 期中之后的内容。
        sections:
          - no: "6.1"
            title: 广义黎曼积分的概念
            state: out
            terms:
              midterm: out
              final: in
            keywords: [广义积分, 反常积分, 瑕积分, 无穷限积分, 收敛性]

      - id: va1-7
        no: "7"
        title: 常微分方程
        state: out
        summary: 期中之后的内容。
        sections:
          - no: "7.1"
            title: 常微分方程的基本概念
            state: out
            terms:
              midterm: out
              final: in
            keywords: [微分方程, 通解, 特解, 初值问题]
          - no: "7.2"
            title: 一阶常微分方程的初等解法
            state: out
            terms:
              midterm: out
              final: in
            keywords: [变量分离, 一阶线性微分方程, 齐次方程]

  - id: la
    name: 线性代数
    short: 线代
    accent: indigo
    book: 线性代数与几何（第 2 版，上）· 俞正光 鲁自群 林润亮
    scope_line: 第 1 章 – 第 3 章「向量组的秩」之前
    scope_note: 第一章 方程组求解与行列式、第二章 矩阵、第三章 n 维向量空间，到向量组的秩之前为止。
    notes_intro: >-
      从解方程组和行列式开始，到矩阵、再到向量组的线性相关性。
      线代的考点大多落在「定义 + 一个算得快的办法」上，所以这里的要点都配了可操作的步骤。
    chapters:
      - id: la-1
        no: "1"
        title: 线性方程组与行列式
        state: in
        summary: 高斯消元、n 阶行列式的定义与性质、展开定理、克莱姆法则。
        sections:
          - no: "1.1"
            title: 线性方程组与高斯消元法
            state: in
            terms:
              midterm: in
              final: in
            keywords: [线性方程组, 高斯消元, 增广矩阵, 齐次线性方程组, 消元, 阶梯形]
          - no: "1.2"
            title: n 阶行列式的定义
            state: in
            terms:
              midterm: in
              final: in
            keywords: [行列式, n阶行列式, 排列, 逆序数, 对换, 定义]
          - no: "1.3"
            title: 行列式的性质与计算
            state: in
            terms:
              midterm: in
              final: in
            keywords: [行列式性质, 行列式计算, 范德蒙德, 爪形, 递推, 升阶, 拆行]
          - no: "1.4"
            title: 行列式的展开定理与克莱姆法则
            state: in
            terms:
              midterm: in
              final: in
            keywords: [展开定理, 代数余子式, 余子式, 克莱姆法则, 克拉默, Cramer]

      - id: la-2
        no: "2"
        title: 矩阵
        state: in
        summary: 矩阵运算、逆矩阵、分块矩阵、初等变换与初等矩阵、相抵标准形。
        sections:
          - no: "2.1"
            title: 矩阵及其运算
            state: in
            terms:
              midterm: in
              final: in
            keywords: [矩阵运算, 矩阵乘法, 转置, 对称矩阵, 反对称, 幂, 迹, 分块]
          - no: "2.2"
            title: 逆矩阵
            state: in
            terms:
              midterm: in
              final: in
            keywords: [逆矩阵, 可逆, 伴随矩阵, 逆矩阵公式, 方阵乘积的行列式, 可逆条件]
          - no: "2.3"
            title: 分块矩阵
            state: in
            terms:
              midterm: in
              final: in
            keywords: [分块矩阵, 分块乘法, 分块求逆, 准对角]
          - no: "2.4"
            title: 初等变换与初等矩阵
            state: in
            terms:
              midterm: in
              final: in
            keywords: [初等变换, 初等矩阵, 行变换, 列变换, 等价, 相抵, 标准形, 求逆]
          - no: "2.5"
            title: 矩阵的相抵与相抵标准形
            state: in
            terms:
              midterm: in
              final: in
            keywords: [相抵, 相抵标准形, 等价关系, 初等变换求逆]

      - id: la-3
        no: "3"
        title: n 维向量空间
        state: in
        summary: n 维向量的运算、线性表示、线性相关与线性无关——止于向量组的秩。
        sections:
          - no: "3.1"
            title: n 维向量及其运算
            state: in
            terms:
              midterm: in
              final: in
            keywords: [n维向量, 向量运算, 数乘, 向量空间, 数域F]
          - no: "3.2"
            title: 向量的线性表示与线性组合
            state: in
            terms:
              midterm: in
              final: in
            keywords: [线性组合, 线性表示, 线性表出, 向量组的等价]
          - no: "3.3"
            title: 向量组的线性相关性
            state: boundary
            terms:
              midterm: boundary
              final: in
            keywords: [线性相关, 线性无关, 相关性, 线性相关性的判定, 齐次方程组非零解]
          - no: "3.4"
            title: 向量组的秩与极大无关组
            state: out
            terms:
              midterm: out
              final: in
            keywords: [向量组的秩, 极大无关组, 秩, 最大无关组]

      - id: la-4
        no: "4"
        title: 向量组的秩之后
        state: out
        summary: 矩阵的秩、方程组解的结构、线性空间与线性变换，期中之后的内容。
        sections:
          - no: "4.1"
            title: 矩阵的秩
            state: out
            terms:
              midterm: out
              final: in
