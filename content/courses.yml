            state: out
            terms:
              midterm: out
              final: in
            keywords: [基础解系, 解空间, 通解, 解的结构]
          - no: "4.3"
            title: 线性空间
            state: out
            terms:
              midterm: out
              final: in
            keywords: [线性空间, 基, 维数, 坐标, 过渡矩阵, 子空间]

