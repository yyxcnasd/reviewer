        count: 4
      - name: 附加题
        count: 1
        points: 5
    topics:
      - chapter: va1-2
        label: 函数极限计算（等价无穷小、洛必达、待定型）
        levels: [1, 2]
      - chapter: va1-2
        label: 分段函数连续与导数定义求极限
        levels: [2, 3]
