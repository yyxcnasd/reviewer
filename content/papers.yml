# 历年真题的考点索引
#
# 由 .work/png/ 下的试卷图片整理而来（mathsdream/THU-math-source 整理版），
# 只做题型与考点的索引，不抄题。字段说明：
#   sections  按卷面题号分块：name 题型名，count 题数，points 每题分值（不同分值的块不写 points）
#   topics    chapter 取 courses.yml 的章节 id，label 一句话概括考什么，levels 难度(1 基础 / 2 常规 / 3 综合 / 4 挑战)
#   notes     这套卷子的一句话特点

papers:
